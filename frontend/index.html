<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notepad — K8s Demo App</title>
  

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0f11;
      --surface:  #16181c;
      --border:   #2a2d35;
      --accent:   #c8f060;
      --accent2:  #60d0f0;
      --muted:    #555b6a;
      --text:     #e8eaf0;
      --text-dim: #9099aa;
      --danger:   #ff5a6a;
      --radius:   12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ─── Noise texture overlay ─── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Auth Screen ─── */
    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
    }

    .auth-logo {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 32px;
      color: var(--accent);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .auth-tagline {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 36px;
      font-family: 'Courier New', Courier, monospace;
    }

    .version-auth-tagline {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 38px;
      font-family: 'Courier New', Courier, monospace;
    }

    .tab-row {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--text-dim);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 7px;
      font-family: 'Courier New', Courier, monospace;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #0e0f11;
      border: none;
      border-radius: 9px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .error-msg {
      background: rgba(255,90,106,0.1);
      border: 1px solid rgba(255,90,106,0.3);
      color: var(--danger);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    /* ─── App Screen ─── */
    #app-screen { display: none; min-height: 100vh; position: relative; z-index: 1; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky; top: 0; z-index: 10;
    }

    .header-brand {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      color: var(--accent);
    }

    .header-user {
      display: flex; align-items: center; gap: 14px;
      font-size: 13px; color: var(--text-dim);
      font-family: 'Courier New', Courier, monospace;
    }

    .btn-logout {
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-dim);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    .app-body {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: calc(100vh - 65px);
    }

    /* ─── Sidebar ─── */
    .sidebar {
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      background: var(--surface);
    }

    .sidebar-top {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .btn-new-note {
      width: 100%;
      padding: 11px 16px;
      background: var(--accent);
      color: #0e0f11;
      border: none;
      border-radius: 9px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex; align-items: center; gap: 8px; justify-content: center;
    }
    .btn-new-note:hover { opacity: 0.88; }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .note-item {
      padding: 14px 16px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.12s;
      margin-bottom: 6px;
    }
    .note-item:hover { background: rgba(255,255,255,0.04); }
    .note-item.active {
      background: rgba(200,240,96,0.08);
      border-color: rgba(200,240,96,0.2);
    }

    .note-item-title {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .note-item-preview {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .note-item-date {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'Courier New', Courier, monospace;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }

    /* ─── Main Editor ─── */
    .editor-pane {
      display: flex; flex-direction: column;
      background: var(--bg);
    }

    .editor-placeholder {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      color: var(--muted);
    }
    .editor-placeholder .big-icon { font-size: 48px; opacity: 0.4; }
    .editor-placeholder p { font-size: 14px; }

    .editor-form { display: none; flex-direction: column; flex: 1; }

    .editor-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
    }

    .editor-toolbar-left { display: flex; gap: 8px; }

    .btn-save {
      padding: 9px 20px;
      background: var(--accent);
      color: #0e0f11;
      border: none; border-radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn-save:hover { opacity: 0.88; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-delete {
      padding: 9px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); }

    .btn-cancel {
      padding: 9px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-cancel:hover { border-color: var(--border); color: var(--text); }

    .editor-title-input {
      width: 100%;
      padding: 28px 28px 12px;
      background: transparent;
      border: none; outline: none;
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 36px;
      font-weight: 400;
      line-height: 1.2;
    }
    .editor-title-input::placeholder { color: var(--muted); }

    .editor-content-input {
      flex: 1;
      padding: 8px 28px 28px;
      background: transparent;
      border: none; outline: none;
      color: var(--text-dim);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.75;
      resize: none;
    }
    .editor-content-input::placeholder { color: var(--muted); }

    .toast {
      position: fixed; bottom: 28px; right: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.25s;
      z-index: 100;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(200,240,96,0.4); color: var(--accent); }
    .toast.error   { border-color: rgba(255,90,106,0.4); color: var(--danger); }

    .loading-dots::after {
      content: '';
      animation: dots 1s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: '.'; }
      33%  { content: '..'; }
      66%  { content: '...'; }
    }

    /* ─── Service badge (shows microservice origin) ─── */
    .service-badge {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
  </style>
</head>
<body>

<!-- ── Auth Screen ─────────────────────────────────────────── -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">notepad.</div>
    <div class="auth-tagline">// kubernetes demo app</div>
    <div class="version-auth-tagline">// v1.1.0 — postgres + blob storage</div>

    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <div id="auth-error" class="error-msg" style="display:none"></div>

    <div id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="your username" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn-primary" id="login-btn" onclick="handleLogin()">Sign In</button>
    </div>

    <div id="register-form" style="display:none">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="choose a username" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="min 6 characters" autocomplete="new-password"/>
      </div>
      <button class="btn-primary" id="register-btn" onclick="handleRegister()">Create Account</button>
    </div>
  </div>
</div>

<!-- ── App Screen ──────────────────────────────────────────── -->
<div id="app-screen">
  <header class="app-header">
    <div class="header-brand">notepad.</div>
    <div class="header-user">
      <span class="service-badge">notes-service</span>
      <span id="header-username"></span>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="btn-new-note" onclick="newNote()">
          <span>＋</span> New Note
        </button>
      </div>
      <div class="notes-list" id="notes-list">
        <div class="empty-state">
          <div class="icon">📝</div>
          <p>No notes yet.<br>Create your first one!</p>
        </div>
      </div>
    </aside>

    <main class="editor-pane">
      <div class="editor-placeholder" id="editor-placeholder">
        <div class="big-icon">✦</div>
        <p>Select a note or create a new one</p>
      </div>

      <div class="editor-form" id="editor-form">
        <div class="editor-toolbar">
          <div class="editor-toolbar-left">
            <button class="btn-save" id="save-btn" onclick="saveNote()">Save</button>
            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
          </div>
          <button class="btn-delete" id="delete-btn" onclick="deleteNote()" style="display:none">Delete</button>
        </div>
        <input class="editor-title-input" id="note-title" placeholder="Note title…" maxlength="100"/>
        <textarea class="editor-content-input" id="note-content" placeholder="Start writing…"></textarea>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  // Use relative paths so requests go through Nginx reverse proxy.
  // Nginx routes /api/auth/* → auth-service:3001
  //              /api/notes/* → notes-service:3002
  const AUTH_URL   = "/api/auth";
  const NOTES_URL  = "/api/notes";

  // ── State ──────────────────────────────────────────────────────────────────
  let token       = null;
  let currentUser = null;
  let notes       = [];
  let activeNoteId = null;
  let isNew        = false;

  // ── Tabs ───────────────────────────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('auth-error').style.display = 'none';
    const btns = document.querySelectorAll('.tab-btn');
    btns[0].classList.toggle('active', tab === 'login');
    btns[1].classList.toggle('active', tab === 'register');
    document.getElementById('login-form').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
  }

  // ── Auth ───────────────────────────────────────────────────────────────────
  async function handleLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    await authRequest('/login', { username, password }, 'login-btn');
  }

  async function handleRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    await authRequest('/register', { username, password }, 'register-btn');
  }

  async function authRequest(path, body, btnId) {
    const btn = document.getElementById(btnId);
    const errEl = document.getElementById('auth-error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Please wait…';

    try {
      const res = await fetch(`${AUTH_URL}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      token = data.token;
      currentUser = data.username;
      enterApp();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = '';
      btn.disabled = false;
      btn.textContent = path === '/login' ? 'Sign In' : 'Create Account';
    }
  }

  function handleLogout() {
    token = null; currentUser = null; notes = []; activeNoteId = null;
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'block';
    document.getElementById('login-username').value = '';
    document.getElementById('login-password').value = '';
    switchTab('login');
  }

  // ── App entry ──────────────────────────────────────────────────────────────
  async function enterApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('header-username').textContent = currentUser;
    await loadNotes();
  }

  // ── Notes CRUD ─────────────────────────────────────────────────────────────
  async function loadNotes() {
    try {
      const res = await fetch(`${NOTES_URL}/notes`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error();
      notes = await res.json();
      renderNotesList();
    } catch {
      showToast('Failed to load notes', 'error');
    }
  }

  function renderNotesList() {
    const el = document.getElementById('notes-list');
    if (notes.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">📝</div><p>No notes yet.<br>Create your first one!</p></div>`;
      return;
    }
    el.innerHTML = notes.map(n => `
      <div class="note-item ${n.id === activeNoteId ? 'active' : ''}" onclick="openNote('${n.id}')">
        <div class="note-item-title">${escHtml(n.title)}</div>
        <div class="note-item-preview">${escHtml(n.content)}</div>
        <div class="note-item-date">${formatDate(n.createdAt)}</div>
      </div>
    `).join('');
  }

  function newNote() {
    isNew = true;
    activeNoteId = null;
    renderNotesList();
    document.getElementById('editor-placeholder').style.display = 'none';
    const form = document.getElementById('editor-form');
    form.style.display = 'flex';
    document.getElementById('note-title').value = '';
    document.getElementById('note-content').value = '';
    document.getElementById('delete-btn').style.display = 'none';
    document.getElementById('note-title').focus();
  }

  function openNote(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    isNew = false;
    activeNoteId = id;
    renderNotesList();
    document.getElementById('editor-placeholder').style.display = 'none';
    const form = document.getElementById('editor-form');
    form.style.display = 'flex';
    document.getElementById('note-title').value = note.title;
    document.getElementById('note-content').value = note.content;
    document.getElementById('delete-btn').style.display = '';
  }

  function cancelEdit() {
    activeNoteId = null; isNew = false;
    document.getElementById('editor-form').style.display = 'none';
    document.getElementById('editor-placeholder').style.display = '';
    renderNotesList();
  }

  async function saveNote() {
    const title   = document.getElementById('note-title').value.trim();
    const content = document.getElementById('note-content').value.trim();
    if (!title || !content) { showToast('Title and content are required', 'error'); return; }

    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';

    try {
      const method = isNew ? 'POST' : 'PUT';
      const url    = isNew ? `${NOTES_URL}/notes` : `${NOTES_URL}/notes/${activeNoteId}`;
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ title, content })
      });
      if (!res.ok) throw new Error();
      const saved = await res.json();
      if (isNew) { activeNoteId = saved.id; isNew = false; }
      await loadNotes();
      renderNotesList();
      document.getElementById('delete-btn').style.display = '';
      showToast('Saved ✓', 'success');
    } catch {
      showToast('Failed to save', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Save';
    }
  }

  async function deleteNote() {
    if (!activeNoteId) return;
    if (!confirm('Delete this note?')) return;

    try {
      const res = await fetch(`${NOTES_URL}/notes/${activeNoteId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error();
      activeNoteId = null;
      document.getElementById('editor-form').style.display = 'none';
      document.getElementById('editor-placeholder').style.display = '';
      await loadNotes();
      showToast('Note deleted', 'success');
    } catch {
      showToast('Failed to delete', 'error');
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function showToast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    setTimeout(() => { el.className = 'toast'; }, 2800);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  // ── Enter key on auth inputs ───────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const loginVisible = document.getElementById('login-form').style.display !== 'none';
      const authVisible  = document.getElementById('auth-screen').style.display !== 'none';
      if (authVisible && loginVisible) handleLogin();
      else if (authVisible) handleRegister();
    }
  });
</script>
</body>
</html>
