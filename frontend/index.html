<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notepad — K8s Demo App</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0f'/%3E%3Ctext x='50' y='72' font-size='65' font-family='Georgia,serif' fill='%237cb800' text-anchor='middle'%3En.%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:     #7cb800;
      --accent-dim: rgba(124,184,0,0.12);
      --bg:         #f5f5f3;
      --surface:    #ffffff;
      --border:     rgba(0,0,0,0.08);
      --border-md:  rgba(0,0,0,0.13);
      --text:       #1a1a18;
      --text-2:     #6b6b68;
      --text-3:     #a0a09c;
      --rail-bg:    #f0efed;
      --sidebar-bg: #f7f7f5;
      --danger:     #c53030;
      --r-md:       8px;
      --r-lg:       12px;
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; background: var(--bg); color: var(--text); line-height: 1.6; }

    /* ═══════════ AUTH ═══════════ */
    #auth-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; position: relative; background: #fafaf8;
    }
    #auth-screen::before {
      content: ''; position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(0,0,0,0.12) 1px, transparent 1px);
      background-size: 28px 28px; pointer-events: none; z-index: 0;
    }
    .auth-badge {
      display: inline-flex; align-items: center; gap: 7px; padding: 5px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 100px;
      font-size: 12px; color: var(--text-2); margin-bottom: 24px; position: relative; z-index: 1;
    }
    .auth-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(.85)} }
    .auth-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; width: 100%; max-width: 400px; }
    .auth-card { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px; box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 8px 32px rgba(0,0,0,.06); }
    .auth-logo { font-size: 24px; font-weight: 600; color: var(--text); letter-spacing: -.5px; margin-bottom: 2px; }
    .auth-logo span { color: var(--accent); }
    .auth-sub { font-size: 13px; color: var(--text-2); margin-bottom: 28px; }
    .tab-row { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab-btn { flex: 1; padding: 9px 0; border: none; border-bottom: 2px solid transparent; background: transparent; color: var(--text-3); font-size: 13px; font-weight: 500; cursor: pointer; margin-bottom: -1px; transition: color .15s, border-color .15s; }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px 12px; background: #f9f9f7; border: 1px solid var(--border); border-radius: var(--r-md); color: var(--text); font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; font-family: inherit; }
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); background: var(--surface); }
    .btn-primary { width: 100%; padding: 11px; background: var(--text); color: var(--surface); border: none; border-radius: var(--r-md); font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .15s, transform .1s; font-family: inherit; }
    .btn-primary:hover { opacity: .85; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .btn-github {
      width: 100%; padding: 11px; background: #24292e; color: #ffffff;
      border: none; border-radius: var(--r-md); font-size: 14px; font-weight: 500;
      cursor: pointer; margin-top: 10px; display: flex; align-items: center;
      justify-content: center; gap: 10px; transition: opacity .15s, transform .1s;
      font-family: inherit;
    }
    .btn-github:hover { opacity: .85; transform: translateY(-1px); }

    .sso-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 16px 0 6px; color: var(--text-3); font-size: 12px;
    }
    .sso-divider::before, .sso-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .auth-footer { font-size: 12px; color: var(--text-3); margin-top: 20px; text-align: center; position: relative; z-index: 1; }
    .error-msg { background: #fff5f5; border: 1px solid rgba(220,38,38,.2); color: var(--danger); border-radius: var(--r-md); padding: 9px 12px; font-size: 13px; margin-bottom: 14px; }

    /* ═══════════ APP ═══════════ */
    #app-screen { display: none; height: 100vh; grid-template-columns: 56px 260px 1fr; overflow: hidden; }

    /* Rail */
    .rail { background: var(--rail-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; }
    .rail-logo { font-size: 17px; font-weight: 700; color: var(--accent); letter-spacing: -1px; margin-bottom: 14px; }
    .rail-icon { width: 36px; height: 36px; border-radius: var(--r-md); border: none; background: transparent; color: var(--text-2); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .12s, color .12s; position: relative; }
    .rail-icon:hover { background: rgba(0,0,0,.06); color: var(--text); }
    .rail-icon.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .rail-icon::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); background: var(--text); color: var(--surface); font-size: 11px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 100; }
    .rail-icon:hover::after { opacity: 1; }
    .rail-spacer { flex: 1; }
    .rail-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-dim); border: 1px solid rgba(124,184,0,.3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #5a8a00; cursor: pointer; position: relative; }
    .avatar-menu { position: absolute; bottom: calc(100% + 8px); left: calc(100% + 8px); background: var(--surface); border: 1px solid var(--border-md); border-radius: var(--r-lg); padding: 6px; min-width: 160px; box-shadow: 0 4px 20px rgba(0,0,0,.1); display: none; z-index: 200; }
    .avatar-menu.open { display: block; }
    .menu-user { padding: 8px 10px 10px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--border); margin-bottom: 6px; }
    .menu-user strong { display: block; font-size: 13px; color: var(--text); margin-bottom: 1px; }
    .menu-item { width: 100%; padding: 8px 10px; border: none; background: transparent; color: var(--text); font-size: 13px; cursor: pointer; border-radius: var(--r-md); display: flex; align-items: center; gap: 8px; font-family: inherit; transition: background .1s; }
    .menu-item:hover { background: #fef2f2; color: var(--danger); }

    /* Sidebar */
    .sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-head { padding: 14px 14px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .sidebar-title { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; }
    .new-note-btn { width: 26px; height: 26px; border-radius: var(--r-md); background: var(--accent); border: none; color: white; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity .15s, transform .1s; }
    .new-note-btn:hover { opacity: .85; transform: scale(1.05); }
    .search-wrap { padding: 10px; border-bottom: 1px solid var(--border); position: relative; }
    .search-icon { position: absolute; left: 19px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
    .search-input { width: 100%; padding: 7px 10px 7px 30px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); font-size: 13px; color: var(--text); outline: none; font-family: inherit; }
    .search-input:focus { border-color: var(--accent); }
    .notes-list { flex: 1; overflow-y: auto; padding: 6px; }
    .notes-list::-webkit-scrollbar { width: 4px; }
    .notes-list::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 4px; }
    .note-item { padding: 10px 12px; border-radius: var(--r-md); cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; transition: background .1s, border-color .1s; }
    .note-item:hover:not(.active) { background: rgba(0,0,0,.03); }
    .note-item.active { background: var(--surface); border-color: var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .ni-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ni-preview { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ni-date { font-size: 11px; color: var(--text-3); margin-top: 4px; }
    .empty-list { text-align: center; padding: 48px 16px; color: var(--text-3); }
    .empty-list-icon { font-size: 32px; margin-bottom: 10px; opacity: .4; }
    .empty-list p { font-size: 13px; line-height: 1.6; }

    /* Editor */
    .editor-pane { display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }
    .editor-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-3); }
    .editor-placeholder-icon { font-size: 40px; opacity: .3; }
    .editor-placeholder p { font-size: 14px; }
    .editor-form { display: none; flex-direction: column; flex: 1; overflow: hidden; }

    /* Top toolbar — save/cancel/delete */
    .editor-toolbar { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: var(--surface); }
    .btn-save { padding: 7px 16px; background: var(--accent); color: white; border: none; border-radius: var(--r-md); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity .15s; }
    .btn-save:hover { opacity: .85; }
    .btn-save:disabled { opacity: .4; cursor: not-allowed; }
    .btn-outline { padding: 7px 14px; background: transparent; border: 1px solid var(--border); border-radius: var(--r-md); color: var(--text-2); font-size: 13px; cursor: pointer; font-family: inherit; transition: background .1s; }
    .btn-outline:hover { background: var(--bg); }
    .toolbar-spacer { flex: 1; }
    .btn-icon { width: 32px; height: 32px; background: transparent; border: 1px solid var(--border); border-radius: var(--r-md); color: var(--text-2); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .1s, color .1s; }
    .btn-icon:hover { background: #fef2f2; color: var(--danger); border-color: rgba(220,38,38,.2); }
    .editor-meta { padding: 2px 24px 0; font-size: 11px; color: var(--text-3); font-family: monospace; }

    /* ═══════════ FORMATTING TOOLBAR ═══════════ */
    .format-toolbar {
      display: flex; align-items: center; gap: 2px; padding: 6px 20px;
      border-bottom: 1px solid var(--border); background: #fafaf8;
      flex-wrap: wrap;
    }
    .fmt-sep { width: 1px; height: 20px; background: var(--border-md); margin: 0 4px; }

    .fmt-btn {
      width: 30px; height: 28px; border: none; background: transparent;
      border-radius: 6px; color: var(--text-2); font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .1s, color .1s; position: relative;
      font-family: inherit;
    }
    .fmt-btn:hover { background: var(--bg); color: var(--text); }
    .fmt-btn.active { background: var(--accent-dim); color: #5a8a00; }

    /* tooltip for format buttons */
    .fmt-btn::after {
      content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%;
      transform: translateX(-50%); background: var(--text); color: var(--surface);
      font-size: 11px; padding: 3px 7px; border-radius: 5px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 100;
    }
    .fmt-btn:hover::after { opacity: 1; }

    /* font family select */
    .fmt-select {
      height: 28px; padding: 0 6px; border: 1px solid var(--border);
      border-radius: 6px; background: transparent; color: var(--text-2);
      font-size: 12px; cursor: pointer; outline: none; font-family: inherit;
    }
    .fmt-select:focus { border-color: var(--accent); }

    /* font size input */
    .fmt-size {
      width: 44px; height: 28px; padding: 0 6px; border: 1px solid var(--border);
      border-radius: 6px; background: transparent; color: var(--text-2);
      font-size: 12px; text-align: center; outline: none; font-family: inherit;
    }
    .fmt-size:focus { border-color: var(--accent); }

    /* color picker */
    .fmt-color {
      width: 28px; height: 28px; padding: 3px; border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; background: transparent;
    }

    /* ═══════════ RICH EDITOR ═══════════ */
    .editor-title-input {
      width: 100%; padding: 20px 24px 8px; background: transparent;
      border: none; outline: none; color: var(--text); font-size: 28px;
      font-weight: 600; letter-spacing: -.5px; font-family: inherit;
    }
    .editor-title-input::placeholder { color: var(--text-3); }
    .editor-divider { height: 1px; background: var(--border); margin: 0 24px 0; }

    /* contenteditable rich text area */
    .editor-content {
      flex: 1; padding: 16px 24px 24px; outline: none; overflow-y: auto;
      font-size: 15px; line-height: 1.8; color: var(--text-2);
      font-family: inherit;
    }
    .editor-content:empty::before { content: 'Start writing…'; color: var(--text-3); pointer-events: none; }
    .editor-content::-webkit-scrollbar { width: 4px; }
    .editor-content::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 4px; }

    /* rich text styles inside editor */
    .editor-content h1 { font-size: 26px; font-weight: 700; color: var(--text); margin: 16px 0 8px; }
    .editor-content h2 { font-size: 20px; font-weight: 600; color: var(--text); margin: 14px 0 6px; }
    .editor-content h3 { font-size: 16px; font-weight: 600; color: var(--text); margin: 12px 0 4px; }
    .editor-content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--text-2); margin: 8px 0; font-style: italic; }
    .editor-content ul, .editor-content ol { padding-left: 24px; margin: 8px 0; }
    .editor-content li { margin: 4px 0; }
    .editor-content code { background: #f0efed; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #d14; }
    .editor-content a { color: var(--accent); text-decoration: underline; }
    .editor-content hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: var(--surface); border-radius: var(--r-lg); padding: 10px 16px; font-size: 13px; display: flex; align-items: center; gap: 8px; transform: translateY(16px); opacity: 0; transition: all .25s cubic-bezier(.34,1.56,.64,1); z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,.15); }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--accent); color: white; }
    .toast.error { background: var(--danger); color: white; }
  </style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-wrapper">
    <div class="auth-badge"><div class="auth-badge-dot"></div> k8s · postgres · azure blob</div>
    <div class="auth-card">
      <div class="auth-logo">note<span>pad.</span></div>
      <div class="auth-sub">Your personal knowledge base</div>
      <div class="tab-row">
        <button class="tab-btn active" onclick="switchTab('login')">Sign in</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>
      <div id="auth-error" class="error-msg" style="display:none"></div>
      <div id="login-form">
        <div class="form-group"><label>Username</label><input type="text" id="login-username" placeholder="your username" autocomplete="username"/></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/></div>
        <button class="btn-primary" id="login-btn" onclick="handleLogin()">Continue →</button>
        <div class="sso-divider">or continue with</div>
        <button class="btn-github" onclick="loginWithGitHub()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          Sign in with GitHub
        </button>
      </div>
      <div id="register-form" style="display:none">
        <div class="form-group"><label>Username</label><input type="text" id="reg-username" placeholder="choose a username" autocomplete="username"/></div>
        <div class="form-group"><label>Password</label><input type="password" id="reg-password" placeholder="min 6 characters" autocomplete="new-password"/></div>
        <button class="btn-primary" id="register-btn" onclick="handleRegister()">Create account →</button>
        <div class="sso-divider">or continue with</div>
        <button class="btn-github" onclick="loginWithGitHub()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          Sign in with GitHub
        </button>
      </div>
    </div>
    <div class="auth-footer">built on kubernetes · postgres · azure blob</div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">

  <!-- Rail -->
  <nav class="rail">
    <div class="rail-logo">n.</div>
    <button class="rail-icon active" data-tip="Notes">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    </button>
    <div class="rail-spacer"></div>
    <div class="rail-avatar" id="rail-avatar" onclick="toggleMenu()">
      <span id="avatar-initials">?</span>
      <div class="avatar-menu" id="avatar-menu">
        <div class="menu-user"><strong id="menu-username">—</strong>signed in</div>
        <button class="menu-item" onclick="handleLogout()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign out
        </button>
      </div>
    </div>
  </nav>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-title">Notes</span>
      <button class="new-note-btn" onclick="newNote()" title="New note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" placeholder="Search notes..." oninput="filterNotes(this.value)"/>
    </div>
    <div class="notes-list" id="notes-list">
      <div class="empty-list">
        <div class="empty-list-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <p>No notes yet.<br/>Click + to create one.</p>
      </div>
    </div>
  </aside>

  <!-- Editor -->
  <main class="editor-pane">
    <div class="editor-placeholder" id="editor-placeholder">
      <div class="editor-placeholder-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
      <p>Select a note or create a new one</p>
    </div>

    <div class="editor-form" id="editor-form">
      <!-- Top toolbar -->
      <div class="editor-toolbar">
        <button class="btn-save" id="save-btn" onclick="saveNote()">Save</button>
        <button class="btn-outline" onclick="cancelEdit()">Cancel</button>
        <div class="toolbar-spacer"></div>
        <button class="btn-icon" id="delete-btn" onclick="deleteNote()" style="display:none" title="Delete">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>

      <!-- Formatting toolbar -->
      <div class="format-toolbar" id="format-toolbar">

        <!-- Font family -->
        <select class="fmt-select" onchange="execCmd('fontName', this.value)" title="Font family">
          <option value="inherit">Default</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Courier New', monospace">Courier New</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
        </select>

        <!-- Font size -->
        <input class="fmt-size" type="number" min="8" max="72" value="15" title="Font size"
          onchange="document.execCommand('fontSize', false, '7'); setCustomSize(this.value)"
          onkeydown="if(event.key==='Enter'){document.execCommand('fontSize',false,'7');setCustomSize(this.value)}"/>

        <div class="fmt-sep"></div>

        <!-- Text style -->
        <button class="fmt-btn" data-tip="Bold (Ctrl+B)" onclick="execCmd('bold')" id="btn-bold"><b>B</b></button>
        <button class="fmt-btn" data-tip="Italic (Ctrl+I)" onclick="execCmd('italic')" id="btn-italic"><i>I</i></button>
        <button class="fmt-btn" data-tip="Underline (Ctrl+U)" onclick="execCmd('underline')" id="btn-underline"><u>U</u></button>
        <button class="fmt-btn" data-tip="Strikethrough" onclick="execCmd('strikeThrough')" id="btn-strike"><s>S</s></button>

        <div class="fmt-sep"></div>

        <!-- Headings -->
        <button class="fmt-btn" data-tip="Heading 1" onclick="execBlock('h1')" style="font-size:11px;font-weight:700;width:36px">H1</button>
        <button class="fmt-btn" data-tip="Heading 2" onclick="execBlock('h2')" style="font-size:11px;font-weight:700;width:36px">H2</button>
        <button class="fmt-btn" data-tip="Heading 3" onclick="execBlock('h3')" style="font-size:11px;font-weight:700;width:36px">H3</button>
        <button class="fmt-btn" data-tip="Paragraph" onclick="execBlock('p')" style="font-size:11px;width:30px">¶</button>

        <div class="fmt-sep"></div>

        <!-- Alignment -->
        <button class="fmt-btn" data-tip="Align left" onclick="execCmd('justifyLeft')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
        </button>
        <button class="fmt-btn" data-tip="Align center" onclick="execCmd('justifyCenter')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <button class="fmt-btn" data-tip="Align right" onclick="execCmd('justifyRight')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="fmt-btn" data-tip="Justify" onclick="execCmd('justifyFull')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="fmt-sep"></div>

        <!-- Lists -->
        <button class="fmt-btn" data-tip="Bullet list" onclick="execCmd('insertUnorderedList')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
        </button>
        <button class="fmt-btn" data-tip="Numbered list" onclick="execCmd('insertOrderedList')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
        </button>
        <button class="fmt-btn" data-tip="Blockquote" onclick="execBlock('blockquote')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
        </button>
        <button class="fmt-btn" data-tip="Indent" onclick="execCmd('indent')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><polyline points="3 12 7 15 3 18"/><line x1="11" y1="12" x2="21" y2="12"/><line x1="11" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="fmt-btn" data-tip="Outdent" onclick="execCmd('outdent')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><polyline points="7 12 3 15 7 18"/><line x1="11" y1="12" x2="21" y2="12"/><line x1="11" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="fmt-sep"></div>

        <!-- Colors -->
        <input class="fmt-color" type="color" title="Text color" value="#1a1a18"
          onchange="execCmd('foreColor', this.value)" title="Text colour"/>
        <input class="fmt-color" type="color" title="Highlight color" value="#ffff00"
          onchange="execCmd('hiliteColor', this.value)" title="Highlight"/>

        <div class="fmt-sep"></div>

        <!-- Extras -->
        <button class="fmt-btn" data-tip="Clear formatting" onclick="execCmd('removeFormat')" style="font-size:12px">✕</button>
        <button class="fmt-btn" data-tip="Horizontal rule" onclick="execCmd('insertHorizontalRule')" style="font-size:16px">—</button>
        <button class="fmt-btn" data-tip="Undo (Ctrl+Z)" onclick="execCmd('undo')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
        </button>
        <button class="fmt-btn" data-tip="Redo (Ctrl+Y)" onclick="execCmd('redo')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4.5"/></svg>
        </button>

      </div>

      <div class="editor-meta" id="editor-meta"></div>
      <input class="editor-title-input" id="note-title" placeholder="Untitled note" maxlength="100"/>
      <div class="editor-divider"></div>

      <!-- contenteditable rich text area instead of textarea -->
      <div class="editor-content" id="note-content" contenteditable="true"
        onkeyup="updateToolbarState()" onmouseup="updateToolbarState()"
        ></div>

    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const AUTH_URL  = "/api/auth";
  const NOTES_URL = "/api/notes";

  let token = null, currentUser = null, notes = [], allNotes = [], activeNoteId = null, isNew = false;

  // ── Formatting commands ───────────────────────────────────────────────────
  function execCmd(cmd, value = null) {
    document.getElementById('note-content').focus();
    document.execCommand(cmd, false, value);
    updateToolbarState();
  }

  function execBlock(tag) {
    document.getElementById('note-content').focus();
    document.execCommand('formatBlock', false, tag);
    updateToolbarState();
  }

  // Set custom font size using a span approach since execCommand fontSize only accepts 1-7
  function setCustomSize(px) {
    const spans = document.querySelectorAll('#note-content font[size="7"]');
    spans.forEach(s => {
      s.removeAttribute('size');
      s.style.fontSize = px + 'px';
    });
  }

  // Update active state of toolbar buttons based on current selection
  function updateToolbarState() {
    const cmds = ['bold','italic','underline','strikeThrough'];
    const ids  = ['btn-bold','btn-italic','btn-underline','btn-strike'];
    cmds.forEach((cmd, i) => {
      const btn = document.getElementById(ids[i]);
      if (btn) btn.classList.toggle('active', document.queryCommandState(cmd));
    });
  }

  // ── Tabs ──────────────────────────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('auth-error').style.display = 'none';
    document.querySelectorAll('.tab-btn').forEach((b,i) =>
      b.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
    document.getElementById('login-form').style.display    = tab==='login'    ? '' : 'none';
    document.getElementById('register-form').style.display = tab==='register' ? '' : 'none';
  }

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function handleLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    await authRequest('/login', {username,password}, 'login-btn', 'Continue →');
  }

  async function handleRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    await authRequest('/register', {username,password}, 'register-btn', 'Create account →');
  }

  async function authRequest(path, body, btnId, label) {
    const btn = document.getElementById(btnId);
    const errEl = document.getElementById('auth-error');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Please wait…';
    try {
      const res  = await fetch(AUTH_URL+path, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      token = data.token; currentUser = data.username;
      enterApp();
    } catch(e) {
      errEl.textContent = e.message; errEl.style.display = '';
      btn.disabled = false; btn.textContent = label;
    }
  }

  function handleLogout() {
    token = null; currentUser = null; notes = []; allNotes = []; activeNoteId = null;
    document.getElementById('avatar-menu').classList.remove('open');
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('login-username').value = '';
    document.getElementById('login-password').value = '';
    switchTab('login');
  }

  function toggleMenu() { document.getElementById('avatar-menu').classList.toggle('open'); }

  document.addEventListener('click', e => {
    if (!document.getElementById('rail-avatar').contains(e.target))
      document.getElementById('avatar-menu').classList.remove('open');
  });

  // ── Enter app ─────────────────────────────────────────────────────────────
  async function enterApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display  = 'grid';
    const initials = currentUser.slice(0,2).toUpperCase();
    document.getElementById('avatar-initials').textContent = initials;
    document.getElementById('menu-username').textContent   = currentUser;
    await loadNotes();
  }

  // ── Notes CRUD ────────────────────────────────────────────────────────────
  async function loadNotes() {
    try {
      const res = await fetch(NOTES_URL+'/notes', {headers:{'Authorization':'Bearer '+token}});
      if (!res.ok) throw new Error();
      allNotes = await res.json(); notes = [...allNotes];
      renderNotesList();
    } catch { showToast('Failed to load notes','error'); }
  }

  function filterNotes(q) {
    const ql = q.toLowerCase();
    // strip HTML tags for search
    notes = ql
      ? allNotes.filter(n => n.title.toLowerCase().includes(ql) || stripHtml(n.content).toLowerCase().includes(ql))
      : [...allNotes];
    renderNotesList();
  }

  function stripHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }

  function renderNotesList() {
    const el = document.getElementById('notes-list');
    if (notes.length === 0) {
      el.innerHTML = '<div class="empty-list"><div class="empty-list-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><p>No notes yet.<br/>Click + to create one.</p></div>';
      return;
    }
    el.innerHTML = notes.map(n => `
      <div class="note-item ${n.id===activeNoteId?'active':''}" onclick="openNote('${n.id}')">
        <div class="ni-title">${esc(n.title||'Untitled')}</div>
        <div class="ni-preview">${esc(stripHtml(n.content||'—'))}</div>
        <div class="ni-date">${fmtDate(n.createdAt)}</div>
      </div>
    `).join('');
  }

  function newNote() {
    isNew = true; activeNoteId = null;
    renderNotesList(); showEditor();
    document.getElementById('note-title').value = '';
    document.getElementById('note-content').innerHTML = '';
    document.getElementById('editor-meta').textContent = '';
    document.getElementById('delete-btn').style.display = 'none';
    document.getElementById('note-title').focus();
  }

  function openNote(id) {
    const note = allNotes.find(n => n.id === id);
    if (!note) return;
    isNew = false; activeNoteId = id;
    renderNotesList(); showEditor();
    document.getElementById('note-title').value = note.title;
    // content is stored as HTML — set innerHTML directly to preserve formatting
    document.getElementById('note-content').innerHTML = note.content || '';
    document.getElementById('editor-meta').textContent = 'saved ' + fmtDate(note.createdAt);
    document.getElementById('delete-btn').style.display = '';
  }

  function showEditor() {
    document.getElementById('editor-placeholder').style.display = 'none';
    document.getElementById('editor-form').style.display = 'flex';
  }

  function cancelEdit() {
    activeNoteId = null; isNew = false;
    document.getElementById('editor-form').style.display = 'none';
    document.getElementById('editor-placeholder').style.display = '';
    renderNotesList();
  }

  async function saveNote() {
    const title   = document.getElementById('note-title').value.trim();
    // save innerHTML to preserve all rich text formatting
    const content = document.getElementById('note-content').innerHTML.trim();
    if (!title) { showToast('Title is required','error'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const method = isNew ? 'POST' : 'PUT';
      const url    = isNew ? NOTES_URL+'/notes' : NOTES_URL+'/notes/'+activeNoteId;
      const res    = await fetch(url, {method, headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body: JSON.stringify({title,content})});
      if (!res.ok) throw new Error();
      const saved = await res.json();
      if (isNew) { activeNoteId = saved.id; isNew = false; }
      document.getElementById('delete-btn').style.display = '';
      document.getElementById('editor-meta').textContent = 'saved just now';
      await loadNotes();
      showToast('Saved','success');
    } catch { showToast('Failed to save','error'); }
    finally { btn.disabled = false; btn.textContent = 'Save'; }
  }

  async function deleteNote() {
    if (!activeNoteId || !confirm('Delete this note?')) return;
    try {
      const res = await fetch(NOTES_URL+'/notes/'+activeNoteId, {method:'DELETE',headers:{'Authorization':'Bearer '+token}});
      if (!res.ok) throw new Error();
      activeNoteId = null;
      document.getElementById('editor-form').style.display = 'none';
      document.getElementById('editor-placeholder').style.display = '';
      await loadNotes();
      showToast('Deleted','success');
    } catch { showToast('Failed to delete','error'); }
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function showToast(msg, type='') {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = 'toast '+type+' show';
    setTimeout(() => { el.className = 'toast'; }, 2600);
  }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso), now = new Date(), diff = now - d;
    if (diff < 60000)     return 'just now';
    if (diff < 3600000)   return Math.floor(diff/60000)+'m ago';
    if (diff < 86400000)  return 'today '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    if (diff < 172800000) return 'yesterday';
    return d.toLocaleDateString([],{month:'short',day:'numeric'});
  }

  // ── Keyboard shortcuts ────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('auth-screen').style.display === 'flex' ||
          document.getElementById('auth-screen').style.display === '') {
        const loginVisible = document.getElementById('login-form').style.display !== 'none';
        if (loginVisible) handleLogin(); else handleRegister();
      }
    }
    if ((e.metaKey||e.ctrlKey) && e.key==='s') {
      e.preventDefault();
      if (document.getElementById('editor-form').style.display !== 'none') saveNote();
    }
  });

  // ── GitHub SSO ────────────────────────────────────────────────────────────
  const AUTH_SERVICE_DIRECT = process.env.AUTH_SVC_BASE_URL   || "http://127.0.0.1:50448";

  function loginWithGitHub() {
    window.location.href = AUTH_SERVICE_DIRECT + "/auth/github";
  }

  // Handle OAuth token returned in URL after GitHub redirect
  function checkOAuthCallback() {
    const params   = new URLSearchParams(window.location.search);
    const tkn      = params.get("token");
    const uname    = params.get("username");
    const err      = params.get("error");

    if (err) {
      window.history.replaceState({}, document.title, "/");
      document.getElementById("auth-error").textContent = "GitHub sign in failed. Please try again.";
      document.getElementById("auth-error").style.display = "";
      return;
    }

    if (tkn && uname) {
      window.history.replaceState({}, document.title, "/");
      token = tkn;
      currentUser = uname;
      enterApp();
    }
  }

  // Check on page load in case we just returned from GitHub OAuth
  checkOAuthCallback();

</script>
</body>
</html>
