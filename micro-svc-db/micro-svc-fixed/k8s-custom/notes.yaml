apiVersion: v1
kind: Namespace
metadata:
  name: notes
  labels:
    name: notes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: notes
  labels:
    app: notes-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
        - name: notes-service
          image: calude-micro-svc-notes-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: auth-service-url
            # Postgres connection
            - name: PG_HOST
              value: "postgres.database.svc.cluster.local"
            - name: PG_PORT
              value: "5432"
            - name: PG_DB
              value: "notesdb"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: password
            # MinIO / Blob storage connection
            - name: BLOB_ENDPOINT
              value: "http://minio.storage.svc.cluster.local:9000"
            - name: BLOB_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: username
            - name: BLOB_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: password
            - name: BLOB_CONTAINER
              value: "notes"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
