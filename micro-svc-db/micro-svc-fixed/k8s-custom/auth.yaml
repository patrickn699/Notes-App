apiVersion: v1
kind: Namespace
metadata:
  name: authentication
  labels:
    name: authentication
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: authentication
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: authentication-service
          image: calude-micro-svc-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            # Postgres connection — points to postgres.database.svc.cluster.local
            - name: PG_HOST
              value: "postgres.database.svc.cluster.local"
            - name: PG_PORT
              value: "5432"
            - name: PG_DB
              value: "authdb"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
