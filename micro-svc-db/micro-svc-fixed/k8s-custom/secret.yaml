# JWT secret for auth-service
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: authentication
type: Opaque
stringData:
  jwt-secret: "super-secret-k8s-key-change-me-in-prod"
---
# Postgres credentials for auth-service
# Secret must exist in the same namespace as the pod that references it
apiVersion: v1
kind: Secret
metadata:
  name: pg-credentials
  namespace: authentication
type: Opaque
stringData:
  username: postgres
  password: postgres123
---
# Postgres credentials for notes-service (same values, different namespace)
apiVersion: v1
kind: Secret
metadata:
  name: pg-credentials
  namespace: notes
type: Opaque
stringData:
  username: postgres
  password: postgres123
---
# MinIO credentials for notes-service
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: notes
type: Opaque
stringData:
  username: minioadmin
  password: minioadmin123
