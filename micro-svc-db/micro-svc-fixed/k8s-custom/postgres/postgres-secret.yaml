# ── Secret — Postgres credentials ─────────────────────────────────────────────
# Secrets are base64-encoded in K8s (not encrypted by default, but kept out of
# plain ConfigMaps and env vars in pod specs).
# In production you'd use Azure Key Vault or Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: database
type: Opaque
stringData:
  username: postgres
  password: postgres123
