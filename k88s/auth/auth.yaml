apiVersion: v1
kind: Namespace
metadata:
  name: authentication
  labels:
    name: authentication
---
apiVersion: apps/v1          # ← was "applications/v1" — does not exist
kind: Deployment             # ← was "Application" — does not exist
metadata:
  name: auth
  namespace: authentication
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: authentication-service
          image: calude-micro-svc-auth-service:latest  # ← verify this matches your actual docker image name
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:                 # ← was missing httpGet wrapper
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:                 # ← was missing httpGet wrapper
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
