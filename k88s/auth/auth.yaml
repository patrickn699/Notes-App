apiVersion: v1
kind: Namespace
metadata:
  name: authentication
  labels:
    name: authentication
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: authentication
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: authentication-service
          image: calude-micro-svc-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            - name: PG_HOST
              value: "postgres.database.svc.cluster.local"
            - name: PG_PORT
              value: "5432"
            - name: PG_DB
              value: "authdb"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: password
            # GitHub OAuth
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: client-secret
            # Base URL of auth-service — used for OAuth callback URL
            # For minikube use the minikube IP + NodePort of auth-service
            # For AKS use your real domain
            - name: BASE_URL
              value: "http://127.0.0.1:50448" #"http://192.168.49.2:30301" # -> auth svc
            # Frontend URL — where to redirect after successful OAuth
            - name: FRONTEND_URL
              value: "http://127.0.0.1:59350"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
