apiVersion: v1
kind: Namespace
metadata:
  name: notes
  labels:
    name: notes
---
apiVersion: apps/v1          # ← was "applications/v1"
kind: Deployment             # ← was "Application"
metadata:
  name: notes-app
  namespace: notes
  labels:
    app: notes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
        - name: notes-service
          image: calude-micro-svc-notes-service:latest  # ← verify image name
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: auth-service-url
            - name: BLOB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: blob-credentials
                  key: connection-string
            - name: BLOB_CONTAINER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: blob-container
            # Postgres
            - name: PG_HOST
              value: "postgres.database.svc.cluster.local"
            - name: PG_PORT
              value: "5432"
            - name: PG_DB
              value: "notesdb"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: password
          readinessProbe:
            httpGet:                 # ← was "httpPath/httpPort" — invalid, must use httpGet
              path: /health          # ← was "/" — use the actual health endpoint
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:                 # ← same fix
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
